name: AI Code Review

# This workflow is read from the trusted default branch. It never executes PR
# scripts; the pinned action only reads the checked-out Git diff and posts a
# summary. Build and test untrusted PR code in ci.yml, where no secrets exist.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-code-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest

    steps:
      - name: Check out the PR head commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Review pull request
        uses: lavyoung/ai-code-review@782c2a7b381ff08bad2eec09844378c7eb9aa312
        with:
          output-language: zh-CN
          comment-enabled: "true"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
