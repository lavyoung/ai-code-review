name: AI Code Review

# Fork PRs never receive repository secrets or a write-capable token. They run
# deterministic evidence stages only; trusted in-repository PRs also receive
# the DeepSeek-backed review and the updatable summary comment.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - v0.1.3_dev

permissions:
  contents: read

concurrency:
  group: ai-code-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-fork:
    name: Review pull request (fork)
    if: github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest

    steps:
      - name: Check out the PR head commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect Java source
        id: java
        shell: bash
        run: |
          set -euo pipefail
          if git ls-tree -r --name-only HEAD | grep -Eq '\.java$'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize Java CodeQL evidence
        if: steps.java.outputs.enabled == 'true'
        uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: java
          build-mode: none

      - name: Analyze Java source
        if: steps.java.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          output: ${{ github.workspace }}/sarif-results
          upload: never

      - name: Locate Java SARIF evidence
        if: steps.java.outputs.enabled == 'true'
        id: sarif
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=("$GITHUB_WORKSPACE"/sarif-results/*.sarif)
          if [[ ${#reports[@]} -ne 1 ]]; then
            echo "Expected exactly one Java CodeQL SARIF report." >&2
            exit 1
          fi
          printf 'path=%s\n' "${reports[0]}" >> "$GITHUB_OUTPUT"

      # This job receives neither DEEPSEEK_API_KEY nor write permissions.
      # SARIF from a fork remains grounded evidence and cannot gate the PR.
      - name: Review pull request
        uses: lavyoung/ai-code-review@be89867ee4c316060f7a99cd14188ab3c2d18496
        with:
          output-language: zh-CN
          comment-enabled: "false"
          deepseek-enabled: "false"
          java-ast-enabled: ${{ steps.java.outputs.enabled }}
          secret-scan-enabled: "true"
          sarif-enabled: ${{ steps.java.outputs.enabled }}
          sarif-report: ${{ steps.sarif.outputs.path }}

  review-internal:
    name: Review pull request
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Check out the PR head commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect Java source
        id: java
        shell: bash
        run: |
          set -euo pipefail
          if git ls-tree -r --name-only HEAD | grep -Eq '\.java$'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # This stage only reads committed Java source. It does not run Maven,
      # Gradle, project tests, or project-provided build scripts.
      - name: Initialize Java CodeQL evidence
        if: steps.java.outputs.enabled == 'true'
        uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: java
          build-mode: none

      - name: Analyze Java source
        if: steps.java.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          output: ${{ github.workspace }}/sarif-results
          upload: never

      - name: Locate Java SARIF evidence
        if: steps.java.outputs.enabled == 'true'
        id: sarif
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=("$GITHUB_WORKSPACE"/sarif-results/*.sarif)
          if [[ ${#reports[@]} -ne 1 ]]; then
            echo "Expected exactly one Java CodeQL SARIF report." >&2
            exit 1
          fi
          printf 'path=%s\n' "${reports[0]}" >> "$GITHUB_OUTPUT"

      - name: Review pull request
        uses: lavyoung/ai-code-review@be89867ee4c316060f7a99cd14188ab3c2d18496
        with:
          output-language: zh-CN
          comment-enabled: "true"
          java-ast-enabled: ${{ steps.java.outputs.enabled }}
          secret-scan-enabled: "true"
          sarif-enabled: ${{ steps.java.outputs.enabled }}
          sarif-report: ${{ steps.sarif.outputs.path }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
