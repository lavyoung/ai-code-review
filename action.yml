name: AI Code Review
description: Review a GitHub pull request with DeepSeek and publish an updatable summary comment.

inputs:
  output-language:
    description: BCP 47 language tag for the generated review text.
    required: false
    default: en
  comment-enabled:
    description: Whether to publish or update the pull request summary comment.
    required: false
    default: "true"
  typescript-enabled:
    description: Whether to run the local TypeScript deterministic analyzer.
    required: false
    default: "false"
  typescript-ast-enabled:
    description: Whether to run the local TypeScript AST analyzer.
    required: false
    default: "false"
  deepseek-enabled:
    description: Whether to run the DeepSeek semantic analyzer.
    required: false
    default: "true"
  sarif-enabled:
    description: Whether to import a local SARIF 2.1.0 report.
    required: false
    default: "false"
  sarif-report:
    description: Path to the SARIF 2.1.0 report generated by an earlier workflow step.
    required: false
    default: ""
  secret-scan-enabled:
    description: Whether to run the local high-confidence secret scanner.
    required: false
    default: "false"
  run-record-path:
    description: Optional path for an append-only sanitized JSONL review record.
    required: false
    default: ""
  quality-store-enabled:
    description: Whether to send sanitized records to the organization quality store.
    required: false
    default: "false"
  quality-store-endpoint:
    description: HTTPS endpoint for the organization quality store.
    required: false
    default: ""
  max-model-input-chars:
    description: Maximum safe JSON diff characters passed to each AI analyzer.
    required: false
    default: "60000"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install action dependencies
      shell: bash
      run: npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH"

    - name: Build action
      shell: bash
      run: npm run build --prefix "$GITHUB_ACTION_PATH"

    - name: Review pull request
      shell: bash
      env:
        DEEPSEEK_API_KEY: ${{ env.DEEPSEEK_API_KEY }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_COMMENT_ENABLED: ${{ inputs.comment-enabled }}
        REVIEW_OUTPUT_LANGUAGE: ${{ inputs.output-language }}
        TYPESCRIPT_ANALYZER_ENABLED: ${{ inputs.typescript-enabled }}
        TYPESCRIPT_AST_ANALYZER_ENABLED: ${{ inputs.typescript-ast-enabled }}
        DEEPSEEK_ANALYZER_ENABLED: ${{ inputs.deepseek-enabled }}
        SARIF_ANALYZER_ENABLED: ${{ inputs.sarif-enabled }}
        SARIF_REPORT_PATH: ${{ inputs.sarif-report }}
        SECRET_SCAN_ANALYZER_ENABLED: ${{ inputs.secret-scan-enabled }}
        REVIEW_RUN_RECORD_PATH: ${{ inputs.run-record-path }}
        QUALITY_STORE_ENABLED: ${{ inputs.quality-store-enabled }}
        QUALITY_STORE_ENDPOINT_URL: ${{ inputs.quality-store-endpoint }}
        QUALITY_STORE_SIGNING_SECRET: ${{ env.QUALITY_STORE_SIGNING_SECRET }}
        REVIEW_MAX_MODEL_INPUT_CHARS: ${{ inputs.max-model-input-chars }}
      run: node "$GITHUB_ACTION_PATH/dist/interfaces/cli/index.js" review --provider github --event pull-request
